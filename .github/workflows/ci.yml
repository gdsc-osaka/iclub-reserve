name: CI

on:
  workflow_dispatch:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

# GITHUB_TOKEN はリポジトリの読み取りのみ許可する (checkout に必要な最小権限)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_format:
    name: Format
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Install node modules
        run: pnpm i

      - name: Format
        run: pnpm format

  run_lint:
    name: Lint
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Install node modules
        run: pnpm i

      - name: Lint
        run: pnpm lint

  run_type_check:
    name: Type Check
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Install node modules
        run: pnpm i

      - name: Type Check
        run: pnpm typecheck

  run_test:
    name: Test
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Install node modules
        run: pnpm i

      - name: Test
        run: pnpm test

  # E2E テスト (ADR-007)。ビルド済みのアプリを手元の Workers (miniflare) で動かし、Playwright で画面を操作する。
  # 安定して通るのを見てから必須のチェックにする。
  run_e2e:
    name: E2E
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Install node modules
        run: pnpm i

      # ブラウザはキャッシュしない。取り出す時間とダウンロードする時間がほぼ同じため (Playwright の推奨)
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm run build

      # E2E 用の設定と DB は playwright.config.ts の webServer (e2e/prepare.ts) が用意する
      - name: E2E
        run: pnpm exec playwright test

      # 落ちたときに、操作の記録 (trace) と画面の写真を見られるようにする
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
