name: CI

on:
  workflow_dispatch:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

# GITHUB_TOKEN はリポジトリの読み取りのみ許可する (checkout に必要な最小権限)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_format:
    name: Format
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Install node modules
        run: pnpm i

      - name: Format
        run: pnpm format

  run_lint:
    name: Lint
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Install node modules
        run: pnpm i

      - name: Lint
        run: pnpm lint

  run_type_check:
    name: Type Check
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Install node modules
        run: pnpm i

      - name: Type Check
        run: pnpm typecheck

  run_test:
    name: Test
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Install node modules
        run: pnpm i

      - name: Test
        run: pnpm test
