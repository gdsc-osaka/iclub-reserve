name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Format (Oxfmt)
        run: pnpm run format

      - name: Lint (Oxlint)
        run: pnpm run lint

      - name: Type Check (tsc)
        run: pnpm run typecheck

      - name: Test (Vitest)
        run: pnpm run test
