name: CI

on:
  workflow_dispatch:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

# GITHUB_TOKEN はリポジトリの読み取りのみ許可する (checkout に必要な最小権限)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_format:
    name: Format
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Install node modules
        run: pnpm i

      - name: Format
        run: pnpm format

  run_lint:
    name: Lint
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Install node modules
        run: pnpm i

      - name: Lint
        run: pnpm lint

  run_type_check:
    name: Type Check
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Install node modules
        run: pnpm i

      - name: Type Check
        run: pnpm typecheck

  run_test:
    name: Test
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Install node modules
        run: pnpm i

      - name: Test
        run: pnpm test

  # E2E テスト (ADR-007)。ビルド済みのアプリを手元の Workers (miniflare) で動かし、Playwright で画面を操作する。
  # 全部のジョブが通ったかは、下の e2e_result (E2E) のチェックにまとめる。
  # ブラウザごとに別のジョブにし、さらにテストのファイルを半分ずつ 2 つのジョブに分けて、並行して動かす
  # (playwright.config.ts の projects と、Playwright の --shard)。
  # ジョブごとにアプリと DB を用意し直すので、ジョブの中では今までどおり 1 つずつ順に動く。
  run_e2e:
    name: E2E (${{ matrix.project }} ${{ matrix.shard }}/2)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Playwright の公式のイメージの中で動かす。全部のブラウザと、ブラウザが使う OS のライブラリが入っている。
    # 前は毎回 `playwright install --with-deps` で入れていたが、Ubuntu のパッケージのミラーが遅いときに
    # 数分から 30 分かかり、時間切れで落ちることがあった。
    # 版は pnpm-lock.yaml の @playwright/test とそろえる。ずれると、Playwright がイメージの更新を求めて止まる。
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      # イメージの既定の root ではなく、ランナーと同じ利用者で動かす (Playwright の CI の手順どおり)。
      # root のままだと Firefox が起動しない
      options: --user 1001
    strategy:
      # 1 つのジョブで落ちても、ほかのジョブの結果は最後まで見る
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari]
        # テストのファイルを 2 つに分けたうちの何番目か。分ける数を変えるときは、name と E2E の --shard の「/2」も変える
        shard: [1, 2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Install node modules
        run: pnpm i

      - name: Build
        run: pnpm run build

      # E2E 用の設定と DB は playwright.config.ts の webServer (e2e/prepare.ts) が用意する
      - name: E2E
        run: pnpm exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2

      # 落ちたときに、操作の記録 (trace) と画面の写真を見られるようにする
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # E2E のジョブ (ブラウザごと・半分ずつの 10 個) が全部通ったかを、1 つのチェックにまとめる。
  # ブランチのルールで必須にするのは、このチェック。ブラウザや分ける数を変えても、ルールを直さずに済む。
  e2e_result:
    name: E2E
    needs: run_e2e
    # E2E のジョブが落ちても、このジョブは動かす。動かずに「スキップ」になると、必須のチェックが通った扱いになるため
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Check E2E results
        if: ${{ needs.run_e2e.result != 'success' }}
        run: |
          echo "E2E のジョブのどれかが通りませんでした (結果: ${{ needs.run_e2e.result }})"
          exit 1
