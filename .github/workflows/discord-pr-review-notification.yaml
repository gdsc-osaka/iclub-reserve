name: Discord PR Review Notification

on:
  pull_request_review:
    types: [submitted]

jobs:
  approved:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: "GitHub Review"

          embed-title: "${{ github.event.review.user.login }} approved #${{ github.event.pull_request.number }} 🎉"
          embed-url: "${{ github.event.review.html_url }}"
          embed-author-name: "${{ github.event.review.user.login }}"
          embed-author-url: "${{ github.event.review.user.html_url }}"
          embed-author-icon-url: "${{ github.event.review.user.avatar_url }}"
          embed-description: "${{ github.event.pull_request.title }}"
          embed-color: "3450963"
          embed-footer-text: "PR opened by ${{ github.event.pull_request.user.login }}"
          embed-footer-icon-url: "${{ github.event.pull_request.user.avatar_url }}"
          embed-timestamp: "${{ github.event.review.submitted_at }}"

  changes_requested:
    if: github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: "GitHub Review"

          embed-title: "${{ github.event.review.user.login }} requested changes for #${{ github.event.pull_request.number }} 🔄"
          embed-url: "${{ github.event.review.html_url }}"
          embed-author-name: "${{ github.event.review.user.login }}"
          embed-author-url: "${{ github.event.review.user.html_url }}"
          embed-author-icon-url: "${{ github.event.review.user.avatar_url }}"
          embed-description: "${{ github.event.pull_request.title }}"
          embed-color: "15352629"
          embed-footer-text: "PR opened by ${{ github.event.pull_request.user.login }}"
          embed-footer-icon-url: "${{ github.event.pull_request.user.avatar_url }}"
          embed-timestamp: "${{ github.event.review.submitted_at }}"

  commented:
    if: github.event.review.state == 'commented'
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: "GitHub Review"

          embed-title: "${{ github.event.review.user.login }} commented on #${{ github.event.pull_request.number }} 💬"
          embed-url: "${{ github.event.review.html_url }}"
          embed-author-name: "${{ github.event.review.user.login }}"
          embed-author-url: "${{ github.event.review.user.html_url }}"
          embed-author-icon-url: "${{ github.event.review.user.avatar_url }}"
          embed-description: "${{ github.event.pull_request.title }}"
          embed-color: "16362240"
          embed-footer-text: "PR opened by ${{ github.event.pull_request.user.login }}"
          embed-footer-icon-url: "${{ github.event.pull_request.user.avatar_url }}"
          embed-timestamp: "${{ github.event.review.submitted_at }}"
