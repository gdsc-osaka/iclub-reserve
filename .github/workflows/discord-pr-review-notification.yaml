name: Discord PR Review Notification

on:
  pull_request_review:
    types: [submitted]

jobs:
  notify:
    # 指定されたレビューステータスの場合のみ実行
    if: contains(fromJSON('["approved", "changes_requested", "commented"]'), github.event.review.state)
    runs-on: ubuntu-latest
    steps:
      - name: Set variables based on review state
        env:
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEWER: ${{ github.event.review.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$REVIEW_STATE" in
            "approved")
              TITLE="$REVIEWER approved #$PR_NUMBER 🎉"
              COLOR="3450963"  # Green
              ;;
            "changes_requested")
              TITLE="$REVIEWER requested changes for #$PR_NUMBER 🔄"
              COLOR="15352629" # Red
              ;;
            *)
              TITLE="$REVIEWER commented on #$PR_NUMBER 💬"
              COLOR="16362240" # Yellow
              ;;
          esac

          echo "EMBED_TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "EMBED_COLOR=$COLOR" >> "$GITHUB_ENV"

      - name: Send Discord notification
        uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: "GitHub Review"
          embed-title: "${{ env.EMBED_TITLE }}"
          embed-url: "${{ github.event.review.html_url }}"
          embed-author-name: "${{ github.event.review.user.login }}"
          embed-author-url: "${{ github.event.review.user.html_url }}"
          embed-author-icon-url: "${{ github.event.review.user.avatar_url }}"
          embed-description: "${{ github.event.pull_request.title }}"
          embed-color: "${{ env.EMBED_COLOR }}"
          embed-footer-text: "PR opened by ${{ github.event.pull_request.user.login }}"
          embed-footer-icon-url: "${{ github.event.pull_request.user.avatar_url }}"
          embed-timestamp: "${{ github.event.review.submitted_at }}"
