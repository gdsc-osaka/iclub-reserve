name: Discord PR Notification

on:
  pull_request:
    types: [opened]

# Discord Webhook を叩くだけで GitHub API は利用しないため GITHUB_TOKEN の権限は不要
permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: "GitHub Pull Request"

          embed-title: "New PR #${{ github.event.pull_request.number }} opened 🚀"
          embed-url: "${{ github.event.pull_request.html_url }}"
          embed-author-name: "${{ github.event.pull_request.user.login }}"
          embed-author-url: "${{ github.event.pull_request.user.html_url }}"
          embed-author-icon-url: "${{ github.event.pull_request.user.avatar_url }}"
          embed-description: "${{ github.event.pull_request.title }}"
          embed-color: "4359668"
          embed-timestamp: "${{ github.event.pull_request.created_at }}"
