# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # 版をそろえないと動かないパッケージは、1 つの PR にまとめて上げる。
    # 分けると片方だけが上がった PR ができ、そのまま取り込むとアプリが動かなくなる
    groups:
      # react-dom は読み込んだ時点で react と版が完全に一致するかを確かめ、違えば止まる
      # （peerDependencies は ^ 付きなので、pnpm の検査では気付けない）。型も一緒に上げる
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # React Router のパッケージは同じ版で出る。package.json でも同じ版に固定している
      react-router:
        patterns:
          - "react-router"
          - "@react-router/*"
      # Better Auth のパッケージは同じ版で出て、どれも better-call を決まった版で求める。
      # 1 つだけ上がると better-call の版が食い違い、CI の Static Checks (`pnpm peers check`) で止まる。CLI の `auth` も同じ版で出る
      better-auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"
          - "auth"
      # Vite と Vite+ をバージョンを揃えて更新
      vite-plus:
        patterns:
          - "vite-plus"
          - "@voidzero-dev/vite-plus-core"
      # @playwright/test を上げるときは、ci.yml の Playwright のイメージ (2 か所) も同じ版に手で上げる。
      # 上げないと E2E が止まるので、ほかの更新とまとめない
      playwright:
        patterns:
          - "@playwright/test"
      # 上のグループに入らない更新のうち、minor と patch は 1 つの PR にまとめる。
      # PR ごとに CI が動き、ほかの PR をマージするたびに最新の develop を取り込んで、また動くため。
      # パッケージは上のグループから順に見て、最初に当てはまったグループに入るので、このグループは最後に置く。
      # major は変更点を 1 つずつ確かめたいので、今までどおりパッケージごとの PR にする。
      # まとめた PR が落ちたら、原因のパッケージを探し、PR に `@dependabot ignore <パッケージ名>` とコメントして外す。
      # 外したパッケージは、`@dependabot unignore <パッケージ名>` とコメントするまで上がらないので、直したら戻す
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ワークフローのアクションは、タグではなくコミットの SHA で固定し、行末のコメントに版を書く
  # （例: `actions/checkout@<SHA> # v7.0.1`）。タグは後から別のコミットに付け替えられるため。
  # Dependabot は SHA と版のコメントを一緒に上げる。アクションを足すときも同じ書き方にする
  - package-ecosystem: "github-actions"
    # "/" を指定すると .github/workflows を見る
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # npm と同じ理由で、minor と patch は 1 つの PR にまとめ、major はアクションごとの PR にする
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
